<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmniTennis – Zagreb court availability</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
</head>
<body>
<header>
  <h1>OmniTennis</h1>
  <p class="sub">Free tennis courts across Zagreb booking systems. Results are cached for {{ cache_ttl_minutes }} min.</p>
</header>

<main>
  <form id="criteria"
        hx-get="/partials/results"
        hx-target="#results"
        hx-trigger="submit, load delay:50ms"
        hx-indicator="#spinner">
    <fieldset>
      <legend>Dates</legend>
      <label>From <input type="date" name="date_from" value="{{ defaults.date_from }}" required></label>
      <label>To <input type="date" name="date_to" value="{{ defaults.date_to }}" required></label>
    </fieldset>

    <fieldset>
      <legend>Slot</legend>
      <label>Min duration
        <select name="min_minutes">
          <option value="60">1 h</option>
          <option value="90">1.5 h</option>
          <option value="120" selected>2 h</option>
          <option value="150">2.5 h</option>
          <option value="180">3 h</option>
        </select>
      </label>
      <label>Indoor/outdoor
        <select name="indoor">
          <option value="any" selected>Any</option>
          <option value="indoor">Indoor only</option>
          <option value="outdoor">Outdoor only</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>Clubs</legend>
      <div class="clubs">
      {% for club in clubs %}
        <label class="chk"><input type="checkbox" name="club" value="{{ club.key }}" checked> {{ club.name }}</label>
      {% endfor %}
      </div>
      <input type="hidden" name="clubs" id="clubs-hidden">
    </fieldset>

    <div class="actions">
      <button type="submit">Search</button>
      <button type="button" id="refresh" title="Ignore cache and re-fetch from all booking systems">Force refresh</button>
      <button type="button" id="reset" title="Restore default criteria">Reset defaults</button>
      <span id="spinner" class="htmx-indicator">Loading…</span>
    </div>
  </form>

  <section id="results" aria-live="polite"></section>
</main>

<script>
  window.OMNI_DEFAULTS = {{ defaults | tojson }};
</script>
<script src="/static/app.js"></script>
</body>
</html>
