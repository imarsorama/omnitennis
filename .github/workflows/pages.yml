name: Publish availability to GitHub Pages

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer run supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMNI_ENABLED_PROVIDERS: mladost,maksimir,zagi,gradanski,prince
      OMNI_PROVIDER_TIMEOUT_SECONDS: "40"
      OMNI_SPORTROUTER_USERNAME: ${{ secrets.OMNI_SPORTROUTER_USERNAME }}
      OMNI_SPORTROUTER_PASSWORD: ${{ secrets.OMNI_SPORTROUTER_PASSWORD }}
      OMNI_SPORTROUTER_REFRESH_TOKEN: ${{ secrets.OMNI_SPORTROUTER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Build static site
        run: python -m app.snapshot --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
